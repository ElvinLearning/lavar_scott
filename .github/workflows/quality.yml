name: Site quality

on:
  pull_request:
  push:
    branches:
      - main
      - "review/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static site
        run: node scripts/verify-site.mjs
